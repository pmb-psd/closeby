<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEE9FF" id="themeColor">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" id="touchIcon" href="icons/apple-touch-icon-neon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closeby">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Closeby</title>
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
/* Closeby · estilo Neón. Lima para lo compartido y las acciones, lila para el ahorro, tinta para la estructura.
   Cada persona conserva su color: Flavia naranja, Ariana verde azulado. */
:root{
  --bg:#EEE9FF; --card:#FFFFFF; --chip:#E2DBFF; --ink:#141317; --muted:#6B6578; --line:rgba(20,19,23,.08);
  --lime:#D5F542; --on-lime:#141317; --lila:#7B4DFF; --lila-2:#A98BFF; --on-lila:#FFFFFF;
  --p1:#E9622B; --p2:#13928E; --good:#1F8A4C; --bad:#D23F3A;
  --dock:#141317; --dock-ink:rgba(255,255,255,.7); --sleep:#BDB3E6; --on-p:#FFFFFF; --soft:#C9B8FF;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141317; --card:#212026; --chip:#2A2930; --ink:#F3F1F7; --muted:#9A96A3; --line:rgba(255,255,255,.06);
    --p1:#FF8A5C; --p2:#3CC9C4; --good:#6FD39A; --bad:#FF7A70; --dock:#26252B; --dock-ink:rgba(255,255,255,.7); --sleep:#3D3A52; --on-p:#141317;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141317; --card:#212026; --chip:#2A2930; --ink:#F3F1F7; --muted:#9A96A3; --line:rgba(255,255,255,.06);
  --p1:#FF8A5C; --p2:#3CC9C4; --good:#6FD39A; --bad:#FF7A70; --dock:#26252B; --dock-ink:rgba(255,255,255,.7); --sleep:#3D3A52; --on-p:#141317;
  color-scheme:dark;
}
*{box-sizing:border-box}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-width:0;min-height:48px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
.field{min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
html{scrollbar-width:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button,a,[role="button"],.item,.cday,.wkev,.chip,label.check{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.sheet,.wkscroll,#wkScroll{overscroll-behavior:contain}
input,textarea,select{font-size:16px}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lila);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:14px 18px 132px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:20px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.press,.btn,.item,.tile-btn{transition:transform 140ms ease-out}
.press:active,.btn:active,.item:active,.tile-btn:active{transform:scale(.97)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* Encabezado */
.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:9;margin:-14px -18px 0;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;transition:background-color 200ms var(--ease),box-shadow 200ms var(--ease)}
html[data-scrolled] .top{background:color-mix(in srgb,var(--bg) 92%,transparent);box-shadow:0 1px 0 var(--line)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){html[data-scrolled] .top{background:color-mix(in srgb,var(--bg) 72%,transparent);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%)}}
@media (prefers-reduced-transparency: reduce){html[data-scrolled] .top{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}}
.brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.brand svg{width:30px;height:30px;color:var(--ink);flex:none}
.brand span{font-family:"Outfit",var(--font);font-size:22px;font-weight:600;letter-spacing:-.03em}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px;font-size:14px}
.me-chip .av{width:36px;height:36px;font-size:15px}
.avbtn{position:relative;border:0;background:none;padding:0;border-radius:50%}
.avcam{position:absolute;right:2px;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 3px var(--card)}.avcam svg{width:16px;height:16px}
.colpick{display:flex;flex-wrap:wrap;gap:10px}
.colsw{width:36px;height:36px;border-radius:50%;border:0;background:var(--sw);box-shadow:0 0 0 2px var(--card);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.colsw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.colsw:disabled{opacity:.35;cursor:not-allowed}
.photorow{display:flex;align-items:center;gap:14px}.photorow .av{width:64px;height:64px;font-size:26px}.photorow .acts{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.av.hasphoto,.wkwho.hasphoto{background-size:cover!important;background-position:center!important;background-repeat:no-repeat!important;color:transparent!important}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#fff;flex:none}
.av.p1{background:var(--p1)} .av.p2{background:var(--p2)}
.avs{display:inline-flex}.avs .av{box-shadow:0 0 0 2px var(--ring,var(--card))}.avs .av+.av{margin-left:-8px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.p1{background:var(--p1)} .dot.p2{background:var(--p2)}
.banner{border-radius:16px;padding:10px 14px;font-size:13px;background:var(--card);border:1px solid var(--line)}

/* Inicio */
.hero-title{font-size:52px;font-weight:300;line-height:.95;letter-spacing:-.045em;margin:6px 0 0}
.hero-title b{font-weight:500}
.hero-title{font-weight:300;letter-spacing:-.04em}.hero-title b{font-weight:700}
.pagetitle{font-weight:400;letter-spacing:-.035em}
h2{font-weight:600;letter-spacing:-.02em}.fig,.big-money{font-weight:600;letter-spacing:-.04em}
.mvic{display:grid;place-items:center}.mvic svg{width:18px;height:18px}
::-webkit-scrollbar{display:none;width:0;height:0;background:transparent}
.mvic.card{background:color-mix(in srgb,var(--lila) 16%,var(--card));color:var(--lila)}
.mvic.trip{background:var(--soft);color:var(--on-lime)}.mvic.out{background:var(--chip);color:var(--ink)}.mvic.in{background:color-mix(in srgb,var(--good) 18%,var(--card));color:var(--good)}
.sectitle{margin:10px 2px -2px;font-size:24px}
.greet{margin:0 0 2px;font-size:24px;line-height:1.2;font-weight:400;letter-spacing:-.015em;color:var(--ink)}
.greet b{font-weight:600}
.note{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.note i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;flex:none}
.tzchips{display:flex;gap:8px;flex-wrap:wrap}
.tzchips span{height:42px;border-radius:999px;background:var(--chip);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px}
.tzchips b{font-weight:600}
.lime{container-type:inline-size;background:var(--lime);color:var(--on-lime);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;--ring:var(--lime)}
.lime .head{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.lime .head .tag{display:flex;align-items:center;gap:6px}
.lime .head .tag::before{content:"";width:3px;height:14px;background:var(--on-lime);border-radius:2px}
.fig{white-space:normal;font-size:clamp(26px,14cqi,56px);font-weight:500;letter-spacing:-.045em;line-height:.9}
.nw{white-space:nowrap}
.fig small{font-size:clamp(14px,6cqi,22px);font-weight:400;opacity:.6;letter-spacing:-.02em}
.stripe{height:26px;border-radius:999px;background:#141317;padding:4px;display:flex;gap:3px}
.stripe i{display:block;height:100%;border-radius:999px;min-width:0}
.stripe i.p1{background:var(--p1)}
.stripe i.p2{background:var(--p2);animation-delay:60ms}
.lime .foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.lime .cta{align-self:flex-start;background:#141317;color:#fff;border:0;border-radius:999px;padding:10px 16px;font-weight:500;display:flex;align-items:center;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;text-decoration:none;color:inherit;min-width:0}
.tile .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#141317;flex:none}
.tile .v{font-size:clamp(18px,6.6vw,26px);font-weight:500;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.tile .k{font-size:12px;color:var(--muted)}
.tile .thin{height:4px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:auto}
.tile .thin i{display:block;height:100%;background:var(--lime)}
:root[data-theme="light"] .tile .thin i{background:var(--lila)}
.purple{background:var(--lila);color:var(--on-lila);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px}
.purple .hd{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:500}
.purple .hd a,.purple .hd button{color:#fff;text-decoration:none;font-size:14px;background:rgba(255,255,255,.16);border:0;border-radius:999px;padding:6px 12px}
.vitem{background:rgba(255,255,255,.13);border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;border:0;text-align:left;width:100%}
.vitem .tx{flex:1;display:flex;flex-direction:column;gap:4px;font-weight:500;min-width:0}
.vitem .tag{align-self:flex-start;background:var(--lime);color:#141317;border-radius:999px;font-size:11px;padding:2px 8px;font-weight:600}
.vitem svg{transform:rotate(-90deg);flex:none}
.empty-p{margin:0;opacity:.85;font-size:14px}

/* Tarjetas genéricas */
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.tile-s{background:var(--chip);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-s .k{font-size:12px;color:var(--muted)}
.tile-s .v{font-weight:600;font-size:clamp(12px,4vw,17px);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.v.good{color:var(--good)} .v.bad{color:var(--bad)}
.bar{height:12px;border-radius:999px;background:var(--chip);display:flex;overflow:hidden;gap:2px}
.bar span{display:block;height:100%;border-radius:999px}
.bar .p1{background:var(--p1)} .bar .p2{background:var(--p2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.big-money{font-size:34px;font-weight:500;letter-spacing:-.04em;line-height:1}
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,96px) 1fr auto;align-items:center;gap:10px;font-size:13px}
.cat .cv{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.cat .cv small{font-size:11px;color:var(--muted)}
.cat .track{height:8px;background:var(--chip);border-radius:999px;overflow:hidden}
.cat .fill{height:100%;background:var(--s-gas);border-radius:999px;display:block}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.item:first-child{border-top:0}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t b{font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.item .t small{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .amt{flex:none}
.item .t small{color:var(--muted);font-size:12px}
.item .amt{text-align:right;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.item .amt b{font-weight:600}
.item .amt small{color:var(--muted);font-size:12px}
.item .dot{width:32px;height:32px;opacity:.9}
.pos{color:var(--good)} .neg{color:var(--ink)}
.empty{padding:14px 0;color:var(--muted);font-size:14px;margin:0}
.btn{border:0;border-radius:999px;padding:13px 18px;font-weight:600;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none}
.btn.limebtn{background:var(--lime);color:#141317}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--lila);font-weight:600;padding:0;text-decoration:none}
:root[data-theme="dark"] .link{color:var(--lila-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .link{color:var(--lila-2)}}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:20px}
.monthnav h2{white-space:nowrap;font-size:clamp(17px,5.4vw,20px)}
.pagetitle{font-size:40px;font-weight:300;letter-spacing:-.04em;line-height:1;margin:4px 0 0}
.row .lockpill{white-space:nowrap;flex:none}
.lockpill{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);align-self:flex-start}

/* Barra flotante */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:min(444px, calc(100% - 32px));height:64px;border-radius:999px;background:var(--dock);
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:0 8px;z-index:10;box-shadow:0 10px 30px rgba(10,10,20,.28),inset 0 1px 0 rgba(255,255,255,.08)}
@supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .dock{background:color-mix(in srgb,var(--dock) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%)}
  .toast{background:color-mix(in srgb,var(--ink) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%)}
}
@media (prefers-reduced-transparency: reduce){.dock{background:var(--dock);-webkit-backdrop-filter:none;backdrop-filter:none}.toast{background:var(--ink);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-contrast: more){.dock{background:var(--dock);box-shadow:0 0 0 1.5px var(--ink)}:root{--line:rgba(0,0,0,.28)}}
.dock a{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;height:48px;color:var(--dock-ink);border-radius:50%;transition:color 200ms var(--ease)}
.dock-pill{position:absolute;top:8px;left:0;width:48px;height:48px;border-radius:50%;background:var(--lime);opacity:0;transform:translateX(0) scale(.8);pointer-events:none}
.dock[data-ready] .dock-pill{transition:transform 300ms var(--ease),opacity 200ms var(--ease)}
.dock a:active svg{transform:scale(.9)}.dock a svg{transition:transform 120ms var(--ease)}
.dock a svg{width:22px;height:22px}
.dock a[aria-current="page"]{color:#141317;width:48px;justify-self:center}
.fab{position:fixed;right:max(16px, calc(50% - 222px));bottom:calc(92px + env(safe-area-inset-bottom));border:0;border-radius:999px;padding:14px 20px;background:var(--lime);color:#141317;font-weight:600;
  box-shadow:0 8px 24px rgba(20,19,23,.25);z-index:9;display:flex;align-items:center;gap:6px}

/* Hoja de registro */
.scrim{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;z-index:20}
.scrim.open{display:flex}
.scrim-bg{position:absolute;inset:0;background:rgba(10,8,20,.5);opacity:0;will-change:opacity}
.sheet{position:relative;will-change:transform;touch-action:pan-y}
.sheet::before{content:"";flex:none;align-self:center;width:38px;height:5px;border-radius:3px;background:var(--muted);opacity:.35;margin:-10px 0 -6px}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:12px 14px;width:100%;min-width:0;font-size:16px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 6px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.amount-row{display:grid;grid-template-columns:1fr 120px;gap:8px}
.amount-row input,.amount-row select{border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:12px 14px;width:100%;min-width:0;font-size:16px}
.amount-row input{font-size:28px;font-weight:500;letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 13px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--lila);color:#fff;border-color:var(--lila)}
.err{color:var(--bad);font-size:13px;min-height:1em;margin:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:500;font-size:18px;margin-bottom:6px;padding:0;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px) scale(.97);display:flex;align-items:center;gap:8px;white-space:nowrap;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity 200ms var(--ease),transform 200ms var(--ease);z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast .ok{width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}.toast .ok svg{width:12px;height:12px}
.invcode{font-family:"Outfit",var(--font);font-size:30px;font-weight:600;letter-spacing:.06em;user-select:all;-webkit-user-select:all}
.tripcard{cursor:pointer;text-align:left}
.tripamt{font-size:26px;font-weight:700;letter-spacing:-.03em}
.tripwho{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--muted);min-width:0}.tripwho .dot{margin-left:2px}
.btn.sm{padding:8px 14px;font-size:13px;flex:none}
.setcard.card{display:flex;flex-direction:row;text-align:left;justify-content:flex-start;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:14px 16px}
.seticon{width:40px;height:40px;border-radius:12px;background:var(--lila);color:var(--on-lime);display:grid;place-items:center;flex:none}
.seticon svg{width:22px;height:22px}

/* ===== Paletas: Rosa y Azul (Neón es la base de arriba) =====
   --lime = color principal (tarjetas destacadas, botón activo), --lila = acento (ahorro, lista de viajes, logo). */
/* Series de gráficos: Gastado / Ahorrado / Libres. Validadas con validate_palette.js (luz y oscuro). */
:root{--s-gas:#7B4DFF;--s-aho:#1F9E76}
:root[data-theme="dark"]{--s-gas:#9473F7;--s-aho:#22A884}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s-gas:#9473F7;--s-aho:#22A884}}
:root[data-palette="rosa"]{--s-gas:#C0465F;--s-aho:#6E9A2E}
:root[data-palette="rosa"][data-theme="dark"]{--s-gas:#D9658A;--s-aho:#7C9F3E}
@media (prefers-color-scheme: dark){:root[data-palette="rosa"]:not([data-theme="light"]){--s-gas:#D9658A;--s-aho:#7C9F3E}}
:root[data-palette="azul"]{--s-gas:#0259DD;--s-aho:#E2553A}
:root[data-palette="azul"][data-theme="dark"]{--s-gas:#5A88F0;--s-aho:#EE6248}
@media (prefers-color-scheme: dark){:root[data-palette="azul"]:not([data-theme="light"]){--s-gas:#5A88F0;--s-aho:#EE6248}}
:root[data-palette="rosa"]{
  --bg:#FEECDE; --card:#FFF9F4; --chip:#F9DDD4; --ink:#282828; --muted:#7A6662; --line:rgba(40,40,40,.09);
  --lime:#E296B2; --on-lime:#282828; --lila:#97181A; --lila-2:#D56989; --on-lila:#FFFFFF; --soft:#C2DC80; --dock:#282828;
  --p1:#D9493A; --p2:#5E8A26; --sleep:#EBC9C0;
}
:root[data-palette="azul"]{
  --bg:#FFE6DD; --card:#FFF8F5; --chip:#FDD6C9; --ink:#132441; --muted:#5D6681; --line:rgba(19,36,65,.09);
  --lime:#84AFFB; --on-lime:#132441; --lila:#0259DD; --lila-2:#FF6648; --on-lila:#FFFFFF; --soft:#DAF561; --dock:#132441;
  --p1:#FF6648; --p2:#3451A3; --sleep:#F3C8BA;
}
@media (prefers-color-scheme: dark){
  :root[data-palette="rosa"]:not([data-theme="light"]){
    --bg:#1D1517; --card:#2B1F22; --chip:#3A2A2E; --ink:#FEECDE; --muted:#BFA6A2; --line:rgba(255,255,255,.07);
  --lime:#E296B2; --on-lime:#282828; --lila:#FF8C93; --lila-2:#E296B2; --on-lila:#282828; --soft:#C2DC80; --dock:#33262A; --sleep:#4A3438;
  --p1:#FF7B6B; --p2:#A9CC6A;
  }
  :root[data-palette="azul"]:not([data-theme="light"]){
    --bg:#0E1626; --card:#182339; --chip:#22304D; --ink:#FFE6DD; --muted:#9AA6C2; --line:rgba(255,255,255,.07);
  --lime:#84AFFB; --on-lime:#132441; --lila:#6E9BFF; --lila-2:#FF6648; --on-lila:#132441; --soft:#DAF561; --dock:#1B2844; --sleep:#2A3A5C;
  --p1:#FF7A60; --p2:#8FB2FF;
  }
}
:root[data-palette="rosa"][data-theme="dark"]{
  --bg:#1D1517; --card:#2B1F22; --chip:#3A2A2E; --ink:#FEECDE; --muted:#BFA6A2; --line:rgba(255,255,255,.07);
  --lime:#E296B2; --on-lime:#282828; --lila:#FF8C93; --lila-2:#E296B2; --on-lila:#282828; --soft:#C2DC80; --dock:#33262A; --sleep:#4A3438;
  --p1:#FF7B6B; --p2:#A9CC6A;
}
:root[data-palette="azul"][data-theme="dark"]{
  --bg:#0E1626; --card:#182339; --chip:#22304D; --ink:#FFE6DD; --muted:#9AA6C2; --line:rgba(255,255,255,.07);
  --lime:#84AFFB; --on-lime:#132441; --lila:#6E9BFF; --lila-2:#FF6648; --on-lila:#132441; --soft:#DAF561; --dock:#1B2844; --sleep:#2A3A5C;
  --p1:#FF7A60; --p2:#8FB2FF;
}

.pill.muted{color:var(--muted)}
.bud{display:flex;flex-direction:column;gap:8px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 116px 36px;gap:8px;align-items:center}
.brow input{min-width:0}
.brow .bx{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--muted);font-size:18px;line-height:1}
.brow .req{font-size:15px;font-weight:600;padding-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.budtotal{display:flex;justify-content:space-between;align-items:baseline;background:var(--chip);border-radius:14px;padding:10px 12px;font-weight:600}
.budtotal b{font-variant-numeric:tabular-nums;font-size:18px}
.blist{display:flex;flex-direction:column;gap:2px;background:var(--chip);border-radius:16px;padding:6px}
.bitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:12px;text-align:left;background:transparent;border:0;color:inherit;width:100%}
.bitem .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;color:#fff}
.bitem.on .ck{background:var(--good);border-color:var(--good)}
.bitem .bt{min-width:0;display:flex;flex-direction:column;gap:4px}
.bitem .bt b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem.on .bt b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.bitem .bt small{font-size:12px;color:var(--muted)}
.bitem .bar{height:5px;border-radius:999px;background:color-mix(in srgb,var(--muted) 22%,transparent);overflow:hidden}
.bitem .bar i{display:block;height:100%;border-radius:999px;background:var(--lila)}
.bitem.on .bar i{background:var(--good)}
.bitem .ba{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.bitem .ba small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.bpay{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:2px 6px 10px 46px;align-items:end}
.cardhero{display:flex;flex-direction:column;gap:4px;background:color-mix(in srgb,var(--lila) 12%,var(--chip));border-radius:18px;padding:14px}
.cardhero small{color:var(--muted);font-size:13px}
.cardhero b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.addchip{border:1px dashed var(--muted)!important;background:transparent!important;color:var(--muted)}
#f-dest button svg{width:13px;height:13px;vertical-align:-2px}
.cday .dots{align-items:center}
.cday .dots i.big{width:8px;height:8px;box-shadow:0 0 0 1.5px var(--card)}
.cday.sel .dots i.big{box-shadow:0 0 0 1.5px var(--ink)}
.legend .dot.big{width:11px;height:11px}
.item.imp{background:color-mix(in srgb,var(--kc) 12%,transparent);border-radius:16px;padding:12px 10px;border-top-color:transparent;margin:4px 0}
.item.imp+.item{border-top-color:transparent}
.item.imp .evdot{width:6px;height:40px}
.item.imp .t b{font-weight:600}
.imptag{align-self:flex-start;background:var(--kc);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:2px 8px;margin-bottom:3px}
.wkev.imp{z-index:2;font-weight:600}
.wkwho{position:absolute;left:3px;bottom:3px;width:13px;height:13px;border-radius:50%;font-style:normal;font-size:8px;font-weight:700;display:grid;place-items:center;background:var(--p1);color:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.85)}
.wkwho.p2{background:var(--p2)}
.wktag{display:block;font-size:8px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.25);color:#fff;border-radius:4px;padding:0 3px;align-self:flex-start;margin-bottom:1px}
[hidden]{display:none !important}
</style>
</head>

  <a href="#dinero" data-tab="dinero" aria-label="Mis finanzas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/></svg></a>

<div class="scrim" id="scrim"><div class="scrim-bg" id="scrimBg"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
const PERSON_COLORS=[["naranja","Naranja","#E9622B","#FF8A5C"],["coral","Coral","#E5484D","#FF7A7E"],["rosa","Rosa","#D6407E","#FF7AAE"],["morado","Morado","#7B4DFF","#A98BFF"],["azul","Azul","#2F6BFF","#6E9BFF"],["turquesa","Turquesa","#13928E","#3CC9C4"],["verde","Verde","#2E8B48","#5FD38A"],["mostaza","Mostaza","#B87900","#F2B53A"]];
(function(){
"use strict";

/* =========================================================
   Entre Husos
   Datos:
   - app/config ............ ajustes compartidos (nombres, ciudades, tipo de cambio)
   - people/<id> ........... qué persona es cada cuenta (cada una escribe solo la suya)
   - viajes/<id> ........... viajes con su meta (compartidos, ambas los editan)
   - movs/<id>/items/<id> .. ahorros para viajes (todas los ven, cada una escribe solo los suyos)
   - data/users/<id>/<id> .. ingresos y gastos personales (privados: solo la dueña los ve)
   ========================================================= */

const DEFAULTS = {
  p1:{name:"Persona 1", tz:"America/Lima", cur:"PEN"},
  p2:{name:"Tu pareja", tz:"America/Toronto", cur:"CAD"},
  rate: 2.41,   // soles por 1 dólar canadiense
  usd: 3.45,    // soles por 1 dólar estadounidense
  view: "PEN"
};
const CURS=["PEN","CAD","USD"];
function okCur(c,d){return CURS.includes(c)?c:(d||"PEN");}
const CITIES = [
  ["America/Lima","Lima (Perú)"],
  ["America/Toronto","Montreal (Canadá)"],
  ["America/Vancouver","Vancouver (Canadá)"],
  ["America/Edmonton","Calgary (Canadá)"],
  ["America/Regina","Regina (Canadá)"],
  ["America/Winnipeg","Winnipeg (Canadá)"],
  ["America/Halifax","Halifax (Canadá)"],
  ["America/St_Johns","St. John's (Canadá)"],
  ["America/New_York","Nueva York (EE. UU.)"],
  ["America/Chicago","Chicago (EE. UU.)"],
  ["America/Menominee","Wisconsin (EE. UU.)"],
  ["America/Denver","Denver (EE. UU.)"],
  ["America/Phoenix","Phoenix (EE. UU.)"],
  ["America/Los_Angeles","Los Ángeles (EE. UU.)"],
  ["America/Anchorage","Anchorage (EE. UU.)"]
];
const CAT_GASTO = ["Comida","Delivery","Transporte","Casa","Salidas","Suscripciones","Salud","Estudios","Regalos","Otros"];
const CAT_INGRESO = ["Sueldo","Freelance","Regalo","Otros"];
let prefs={};   // preferencias privadas de quien usa la app: data/users/<id>/prefs
function cleanList(a,def){return Array.isArray(a)&&a.length?a.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim().slice(0,24)).slice(0,30):def;}
function catsGasto(){return cleanList(prefs.catsGasto,CAT_GASTO);}
function catsIngreso(){return cleanList(prefs.catsIngreso,CAT_INGRESO);}
function budget(){const b=prefs.budget||{};const amt=Math.max(0,Number(b.amount)||0);return {amount:amt,cur:["PEN","CAD","USD"].includes(b.cur)?b.cur:(cfg[me]?cfg[me].cur:"PEN")};}
async function savePrefs(part){
  prefs={...prefs,...part}; renderAll(true); if(tab==="ajustes") renderAjustes();
  if(!db||!uid){toast("Sin conexión: no se guardó.");return;}
  try{ await db.doc("data/users/"+uid+"/prefs").set(prefs); }catch(e){ toast(errMsg(e)); }
}

/* ---------- Estado ---------- */
let db=null, uid=null, me=null;
let cfg=mergeCfg({}), cfgExists=false;
let people={};
let presence={}, photos={};   // slot -> {online, seen}            // id de cuenta -> "p1" | "p2"
let viajes=[];            // compartidos
const aportesBy={};       // id de cuenta -> ahorros
const aporteSubs={};
let aportes=[];
let mine=[];              // mis ingresos y gastos (privados)
let tab="inicio";
let month=todayStr().slice(0,7);
const loaded={cfg:false,people:false,priv:false,viajes:false};
let migrating=false;

/* ---------- Utilidades ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function todayStr(){const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function num(v,d){const n=Number(v);return isFinite(n)?n:d;}
function isDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||"");}
function isDarkNow(){const t=document.documentElement.dataset.theme;return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);}
function applyPersonColors(){
  const dark=isDarkNow(), r=document.documentElement.style;
  ["p1","p2"].forEach(k=>{const c=PERSON_COLORS.find(x=>x[0]===(cfg&&cfg[k]&&cfg[k].color));if(c)r.setProperty("--"+k,dark?c[3]:c[2]);else r.removeProperty("--"+k);});
}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>applyPersonColors());}catch(e){}
async function savePersonColor(col){
  if(!me) return;
  const part={...cfg[me],color:col};
  cfg=mergeCfg({...cfg,[me]:part}); applyPersonColors(); renderAll(true); if(document.getElementById("pf-colors")) openProfileSheet();
  if(!db){toast("Sin conexión: no se guardó.");return;}
  try{ const ref=db.doc("app/config"); if(cfgExists) await ref.update({[me]:part}); else {await ref.set({...cfg});cfgExists=true;} toast("Guardado: tu color"); }
  catch(x){toast(errMsg(x));}
}
function mergeCfg(d){
  d=(d&&typeof d==="object")?d:{};
  const c={...DEFAULTS,...d,p1:{...DEFAULTS.p1,...(d.p1||{})},p2:{...DEFAULTS.p2,...(d.p2||{})}};
  c.rate=num(c.rate,2.41)>0?num(c.rate,2.41):2.41;
  c.usd=num(c.usd,3.45)>0?num(c.usd,3.45):3.45;
  c.ratesUpdated=isDate(c.ratesUpdated)?c.ratesUpdated:"";
  ["p1","p2"].forEach(k=>{ c[k].birthday=isDate(c[k].birthday)?c[k].birthday:""; if(!PERSON_COLORS.some(x=>x[0]===c[k].color)) delete c[k].color; });
  const rel=(d.relation&&typeof d.relation==="object")?d.relation:{};
  c.relation={start:isDate(rel.start)?rel.start:"",mesesario:rel.mesesario!==false};
  ["p1","p2"].forEach(k=>{ c[k].cur=okCur(c[k].cur,DEFAULTS[k].cur); if(typeof c[k].name!=="string") c[k].name=DEFAULTS[k].name; });
  c.view=okCur(c.view,"PEN");
  return c;
}
function cleanPersonal(id,d){
  if(!d||typeof d!=="object") return null;
  const T=["ingreso","gasto","pot_in","pot_out","fund_in","fund_out","card_pay"];
  const m={id, kind:"personal", type:T.includes(d.type)?d.type:"gasto", ref:typeof d.ref==="string"?d.ref:"", amount:Math.abs(num(d.amount,0)), cur:okCur(d.cur),
    cat:typeof d.cat==="string"?d.cat.slice(0,40):"Otros", note:typeof d.note==="string"?d.note.slice(0,120):"",
    date:isDate(d.date)?d.date:todayStr(), created:num(d.created,0), who:me, acct:d.acct==="credito"?"credito":"debito"};
  return m.amount>0?m:null;
}
function cleanAporte(id,d,owner,slot){
  if(!d||typeof d!=="object") return null;
  if(d.type && d.type!=="aporte") return null;   // restos del formato anterior: no son ahorros
  const m={id, owner, kind:"aporte", type:"aporte", who:slot, amount:Math.abs(num(d.amount,0)), cur:okCur(d.cur),
    viaje:typeof d.viaje==="string"?d.viaje:"", note:typeof d.note==="string"?d.note.slice(0,120):"",
    date:isDate(d.date)?d.date:todayStr(), created:num(d.created,0), out:d.out===true};
  return m.amount>0?m:null;
}
function cleanBudget(a){
  if(!Array.isArray(a)) return [];
  return a.slice(0,30).filter(b=>b&&typeof b==="object"&&typeof b.name==="string"&&b.name.trim()).map((b,i)=>({
    id:typeof b.id==="string"&&b.id?b.id.slice(0,24):"b"+i, name:b.name.trim().slice(0,30), amount:Math.max(0,num(b.amount,0)),
    bought:b.bought===true, paid:b.paid==null||b.paid===""?null:Math.max(0,num(b.paid,0))}));
}
function budgetCost(b){return b.bought&&b.paid!=null?b.paid:b.amount;}
function cleanViaje(id,d){
  if(!d||typeof d!=="object") return null;
  const budget=cleanBudget(d.budget);
  return {id, name:(typeof d.name==="string"&&d.name.trim())?d.name.slice(0,40):"Viaje",
    target:budget.length?Math.round(budget.reduce((s,b)=>s+budgetCost(b),0)*100)/100:Math.max(0,num(d.target,0)),
    budget, cur:okCur(d.cur), date:isDate(d.date)?d.date:"", place:typeof d.place==="string"?d.place.slice(0,40):"", created:num(d.created,0)};
}
function apSigned(a){return a.out?-a.amount:a.amount;}
const BUD_REQ=["Vuelos","Hotel","Comida"], BUD_IDS=["vuelos","hotel","comida"], BUD_OPT=["Transporte","Actividades","Seguro de viaje","Regalos","Compras"];
function budgetSummary(v){const b=v.budget||[];let paid=0,pend=0,n=0;b.forEach(x=>{if(x.bought){paid+=budgetCost(x);n++;}else pend+=x.amount;});return {paid,pend,n,count:b.filter(x=>x.amount>0||x.bought).length};}
function solesPer(c){return c==="CAD"?cfg.rate:c==="USD"?cfg.usd:1;}
function conv(a,from,to){ if(from===to) return a; return a*solesPer(from)/solesPer(to); }
function sym(c){return c==="CAD"?"C$":c==="USD"?"US$":"S/";}
function curName(c){return c==="CAD"?"dólares canadienses":c==="USD"?"dólares estadounidenses":"soles";}
function money(n,c){return sym(c)+" "+Number(n||0).toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});}
function moneyShort(n,c){n=Number(n||0);const small=Math.abs(n)<10&&Math.round(n)!==n;return sym(c)+" "+(small?n.toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2}):Math.round(n).toLocaleString("es-PE"));}
function pfull(k){return ((cfg[k]&&cfg[k].name)||"").trim()||(k==="p1"?"Persona 1":"Persona 2");}
function pname(k){return pfull(k).split(/\s+/)[0];}
function cityName(tz){const f=CITIES.find(c=>c[0]===tz);return f?f[1].split(" (")[0].split(" / ")[0]:tz.split("/").pop().replace(/_/g," ");}
function tzOffset(tz,d){
  try{const s=d.toLocaleString("en-US",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const m=s.match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);let h=+m[4];if(h===24)h=0;
    return Math.round((Date.UTC(+m[3],+m[1]-1,+m[2],h,+m[5],+m[6])-d.getTime())/60000);}catch(e){return 0;}
}
function daysUntil(ds){ if(!isDate(ds)) return null; const [y,m,d]=ds.split("-").map(Number),t=new Date(); return Math.round((Date.UTC(y,m-1,d)-Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()))/86400000); }
function fmtDate(ds,o){const [y,m,d]=ds.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-PE",o||{day:"numeric",month:"short"});}
function toast(msg){const t=document.getElementById("toast");const ok=/^(Guardad|Listo|Tus datos se guardaron|Presupuesto guardado|Monedas guardadas|Colores|Registrado|Agendado|Ahorro creado|Fondo creado|Viaje creado|Viaje actualizado|Ahora )/.test(msg);t.innerHTML=(ok?'<span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>':"")+'<span></span>';t.lastChild.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);}
function setStatus(msg){const s=document.getElementById("status");if(msg){s.textContent=msg;s.hidden=false;}else s.hidden=true;}
function sortByDate(a,b){return a.date<b.date?1:a.date>b.date?-1:(b.created-a.created);}
const LOCK=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

/* ---------- Cálculos ---------- */
function viajeById(id){return viajes.find(v=>v.id===id)||null;}
function viajeStats(v){
  let saved=0; const by={p1:0,p2:0};
  aportes.forEach(a=>{ if(a.viaje===v.id){const x=conv(apSigned(a),a.cur,v.cur);saved+=x;by[a.who]+=x;} });
  saved=Math.max(0,saved); by.p1=Math.max(0,by.p1); by.p2=Math.max(0,by.p2);
  const remaining=Math.max(0,v.target-saved), days=daysUntil(v.date);
  const perWeek=(v.target>0&&days!==null&&days>0)?remaining/Math.max(1,days/7):null;
  return {saved,by,remaining,days,perWeek,pct:v.target>0?Math.min(1,saved/v.target):0};
}
function nextViaje(){
  return viajes.filter(v=>{const d=daysUntil(v.date);return d!==null&&d>=0;}).sort((a,b)=>a.date<b.date?-1:1)[0]||null;
}
function sortedViajes(){
  return [...viajes].sort((a,b)=>{
    const da=daysUntil(a.date), dbb=daysUntil(b.date);
    const pa=da===null?1e9:(da<0?2e9-da:da), pb=dbb===null?1e9:(dbb<0?2e9-dbb:dbb);
    return pa-pb || b.created-a.created;
  });
}
function viewCur(){return me&&cfg[me]?cfg[me].cur:cfg.view;}
function myMonthTotals(ym){
  const v=viewCur(),r={ingreso:0,gasto:0,ahorro:0};
  mine.forEach(m=>{ if(m.date.slice(0,7)!==ym) return; const a=conv(m.amount,m.cur,v);
    if(m.type==="ingreso"||m.type==="gasto") r[m.type]+=a; else if(m.type==="pot_in") r.ahorro+=a; else if(m.type==="pot_out") r.ahorro-=a; });
  aportes.forEach(a=>{ if(a.owner===uid && a.date.slice(0,7)===ym) r.ahorro+=conv(apSigned(a),a.cur,v); });
  return r;
}

/* ---------- Piezas ---------- */
function clockHTML(k){return `<div class="clock ${k}"><span class="who">${esc(pname(k))} · ${esc(cityName(cfg[k].tz))}</span><b id="clk-${k}">--:--</b><span class="day" id="day-${k}"></span></div>`;}
function tickClocks(){
  const now=new Date();
  ["p1","p2"].forEach(k=>{const el=document.getElementById("clk-"+k);if(!el)return;
    try{el.textContent=now.toLocaleTimeString("es-PE",{timeZone:cfg[k].tz,hour:"2-digit",minute:"2-digit",hour12:false});
      const dy=document.getElementById("day-"+k); if(dy) dy.textContent=now.toLocaleDateString("es-PE",{timeZone:cfg[k].tz,weekday:"long",day:"numeric",month:"short"});}catch(e){el.textContent="--:--";}});
  const d=document.getElementById("tzdiff");
  if(d){const diff=(tzOffset(cfg.p2.tz,now)-tzOffset(cfg.p1.tz,now))/60,h=Math.abs(diff),hs=(Number.isInteger(h)?h:h.toFixed(1))+" h";
    d.textContent=diff===0?"Ahora mismo tienen la misma hora":`${pname("p2")} va ${hs} ${diff>0?"adelante":"atrás"} de ${pname("p1")}`;}
}
function barHTML(v,st){

function myCur(){return cfg[me]?cfg[me].cur:"PEN";}
function balanceInfo(){
  const c=myCur(); let ing=0,gas=0,aho=0,cred=0,pay=0;
  mine.forEach(m=>{const a=conv(m.amount,m.cur,c); if(m.type==="ingreso") ing+=a; else if(m.type==="gasto"){gas+=a; if(m.acct==="credito") cred+=a;} else if(m.type==="card_pay") pay+=a; else if(m.type==="pot_in") aho+=a; else if(m.type==="pot_out") aho-=a;});
  aportes.forEach(a=>{ if(a.owner===uid) aho+=conv(apSigned(a),a.cur,c); });
  const sb=prefs.startBalance&&Number.isFinite(Number(prefs.startBalance.amount))?prefs.startBalance:null;
  const base=sb?conv(Number(sb.amount),["PEN","CAD","USD"].includes(sb.cur)?sb.cur:c,c):0;
  return {c,ing,gas,aho,base,hasStart:!!sb,cred,pay,debt:cred-pay,avail:base+ing-(gas-cred)-pay-aho};
}
function monthHistory(){
  const c=myCur(), by={};
  const add=(ym,k,v)=>{(by[ym]=by[ym]||{ing:0,gas:0,aho:0})[k]+=v;};
  mine.forEach(m=>{const ym=m.date.slice(0,7),a=conv(m.amount,m.cur,c);
    if(m.type==="ingreso") add(ym,"ing",a); else if(m.type==="gasto") add(ym,"gas",a); else if(m.type==="pot_in") add(ym,"aho",a); else if(m.type==="pot_out") add(ym,"aho",-a);});
  aportes.forEach(a=>{ if(a.owner===uid) add(a.date.slice(0,7),"aho",conv(apSigned(a),a.cur,c)); });
  return Object.keys(by).sort().reverse().map(ym=>({ym,...by[ym]}));
}

    return `<div class="crow"><span class="cn"><i class="dot ${k}"></i>${esc(pname(k))}</span><span class="cv num"><b>${money(st.by[k],v.cur)}</b>${o&&o!==money(st.by[k],v.cur)?`<small>puso ${esc(o)}</small>`:""}</span><span class="cp num">${Math.round(pc)}%</span></div>`;}).join("")}

function bindTripBudget(v){
  document.querySelectorAll("[data-bitem]").forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.bitem, x=v.budget[i], box=document.getElementById("bpay-"+i);

    if(!box.hidden){box.hidden=true;box.innerHTML="";return;}
    box.hidden=false;
    box.innerHTML=x.bought?`<span class="small muted">¿Lo desmarcas? Volverá a «Falta comprar».</span><button class="btn ghost sm" type="button" id="bp-undo">Desmarcar</button>`
      :`<div class="field" style="gap:4px"><label for="bp-amt" class="small">¿Cuánto pagaron? (${sym(v.cur)})</label><input id="bp-amt" type="number" inputmode="decimal" min="0" step="0.01" value="${x.amount||""}" placeholder="0.00"></div><button class="btn limebtn sm" type="button" id="bp-ok">Comprado</button>`;
    const save=async nb=>{const data={name:v.name,target:Math.round(nb.reduce((s,b)=>s+budgetCost(b),0)*100)/100,budget:nb,cur:v.cur,date:v.date,place:v.place,created:v.created||Date.now()};
      try{await db.doc("viajes/"+v.id).set(data);}catch(e){toast(errMsg(e));return false;} return true;};
    const ok=document.getElementById("bp-ok"), undo=document.getElementById("bp-undo");

}

function cleanRep(d){

    sh.innerHTML=`

    ${e.kind==="especial"&&!act?`<div class="hintrow"><button class="link small" type="button" id="e-aniv">¿Es su aniversario o mesesario?</button><a class="link small" href="#perfil" id="e-bday">¿Un cumpleaños? Va en tu perfil</a></div>`:""}
    <div class="field"><label for="e-date">Fecha</label><input id="e-date" type="date" value="${esc(e.date)}"></div>
    ${e.kind==="especial"?"":`<div class="grid2"><div class="field"><label for="e-start">Desde (tu hora)</label><input id="e-start" type="time" value="${esc(e.start)}"></div><div class="field"><label for="e-end">Hasta (opcional)</label><input id="e-end" type="time" value="${esc(e.end)}"></div></div>`}

    ${e.rep.freq==="none"?"":`<div class="repbox">
      <div class="everyrow"><label for="e-every">Cada</label><input id="e-every" type="number" inputmode="numeric" min="1" max="12" value="${e.rep.every}"><span>${{daily:"día(s)",weekly:"semana(s)",monthly:"mes(es)",yearly:"año(s)"}[e.rep.freq]}</span></div>

      <div class="field"><span class="lab">¿Hasta cuándo?</span>
        <div class="seg" id="e-endmode"><button type="button" data-m="never" aria-pressed="${!(e.rep.until||e._untilMode)}">Para siempre</button><button type="button" data-m="until" aria-pressed="${!!(e.rep.until||e._untilMode)}">Hasta una fecha</button></div>

    <div class="field"><label for="e-note">Nota (opcional)</label><input id="e-note" maxlength="140" value="${esc(e.note)}"></div>

      <div class="seg" id="e-vis"><button type="button" data-v="private" aria-pressed="${e.vis==="private"}">${ICON_LOCK} Solo yo</button><button type="button" data-v="shared" aria-pressed="${e.vis==="shared"}">Compartir con ${esc(pname(other))}</button></div>

    ${act?`<button class="btn danger block" type="button" id="e-del">${act.rep.freq!=="none"?"Eliminar toda la serie":"Eliminar"}</button>`:""}`;

      else document.getElementById("e-conv").textContent="";};
    upd(); const st=document.getElementById("e-start"); if(st) st.oninput=upd; document.getElementById("e-date").oninput=upd;
    document.getElementById("e-close").onclick=closeSheet;
    const ea=document.getElementById("e-aniv"); if(ea) ea.onclick=openRelationSheet;
    const eb=document.getElementById("e-bday"); if(eb) eb.onclick=()=>closeSheet();
    document.getElementById("e-freq").onchange=()=>{keep();if(e.rep.freq==="weekly"&&!e.rep.days.length&&isDate(e.date))e.rep.days=[wdOf(e.date)];draw();};
    sh.querySelectorAll("#e-days button").forEach(b=>b.onclick=()=>{keep();const d=Number(b.dataset.d);let ds=e.rep.days.length?e.rep.days:[wdOf(e.date)];ds=ds.includes(d)?ds.filter(x=>x!==d):[...ds,d];if(!ds.length){toast("Deja al menos un día");return;}e.rep.days=ds;draw();});
    sh.querySelectorAll("#e-endmode button").forEach(b=>b.onclick=()=>{keep();if(b.dataset.m==="never"){e.rep.until="";e._untilMode=false;}else{e._untilMode=true;}draw();});
    ["e-every","e-until","e-date"].forEach(id=>{const x=document.getElementById(id);if(x)x.addEventListener("input",rtext);}); rtext();
    sh.querySelectorAll("#e-kind button").forEach(b=>b.onclick=()=>{keep();const prev=e.kind;e.kind=b.dataset.k;if(e.kind==="especial"){e.rep={freq:"yearly",every:1,days:[],until:""};e.start="";e.end="";}else if(prev==="especial"&&e.rep.freq==="yearly")e.rep.freq="none";
      if(!act&&!e._visTouched) e.vis=BUSY_KINDS.includes(e.kind)?"private":"shared"; draw();});
    sh.querySelectorAll("#e-vis button").forEach(b=>b.onclick=()=>{keep();e.vis=b.dataset.v;e._visTouched=true;draw();});
    document.getElementById("e-save").onclick=async()=>{
      keep(); const err=document.getElementById("e-err");
      if(!e.title.trim()){err.textContent="Ponle un nombre.";return;}
      if(!isDate(e.date)){err.textContent="Elige una fecha.";return;}

      if(isHM(e.start)&&isHM(e.end)&&toMin(e.end)<=toMin(e.start)){err.textContent="La hora final tiene que ser después de la inicial.";return;}
      if(e.rep.freq!=="none"&&e._untilMode&&!isDate(e.rep.until)){err.textContent="Elige hasta qué fecha se repite.";return;}
      if(e.rep.until&&e.rep.until<e.date){err.textContent="La fecha final tiene que ser después del primer día.";return;}
      const repData=e.rep.freq==="none"?{freq:"none",every:1,days:[],until:""}:{freq:e.rep.freq,every:e.rep.every,days:e.rep.freq==="weekly"?(e.rep.days.length?e.rep.days:[wdOf(e.date)]):[],until:e.rep.until||""};
      const data={title:e.title.trim(),kind:e.kind,date:e.date,start:isHM(e.start)?e.start:"",end:isHM(e.start)&&isHM(e.end)?e.end:"",tz:cfg[me].tz,rep:repData,exdates:e.rep.freq==="none"?[]:e.exdates,note:e.note.trim(),created:e.created||Date.now()};
      const btn=document.getElementById("e-save"); btn.disabled=true;
      try{
        if(act&&act.vis===e.vis) await myActsCol(e.vis).doc(act.id).set(data);
        else { await myActsCol(e.vis).add(data); if(act) await myActsCol(act.vis).doc(act.id).delete(); }
        closeSheet(); toast(act?(act.vis!==e.vis?(e.vis==="private"?"Ahora solo tú la ves":"Ahora la comparten"):"Cambios guardados"):"Agendado");
      }catch(x){btn.disabled=false;err.textContent=errMsg(x);}
    };
    const d1=document.getElementById("e-delone");
    if(d1) d1.onclick=async()=>{try{await myActsCol(act.vis).doc(act.id).update({exdates:[...act.exdates,occ]});closeSheet();toast("Se quitó ese día");}catch(x){document.getElementById("e-err").textContent=errMsg(x);}};
    const del=document.getElementById("e-del");
    if(del) del.onclick=async()=>{if(del.dataset.confirm!=="1"){del.dataset.confirm="1";del.textContent="Toca otra vez para eliminar";return;}
      try{await myActsCol(act.vis).doc(act.id).delete();closeSheet();toast("Eliminada");}catch(x){document.getElementById("e-err").textContent=errMsg(x);}};
  };
  draw(); openScrim();
}

async function setPhoto(file){
  if(!/^image\//.test(file.type||"image/")){toast("Elige una imagen.");return;}
  try{
    const url=URL.createObjectURL(file), img=new Image(); img.src=url; await img.decode();
    const s=Math.min(img.naturalWidth,img.naturalHeight); if(!s) throw 0;
    const cv=document.createElement("canvas"); cv.width=cv.height=256;
    cv.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,256,256);
    URL.revokeObjectURL(url);
    let q=.85, data=cv.toDataURL("image/jpeg",q); while(data.length>90000&&q>.4){q-=.15;data=cv.toDataURL("image/jpeg",q);}
    await savePhoto(data);
  }catch(e){toast("No se pudo leer esa imagen. Prueba con otra.");}
}
async function savePhoto(data){
  if(!db||!uid||!me){toast("Sin conexión: no se guardó.");return;}
  const prev=photos[me]; if(data) photos[me]=data; else delete photos[me];
  applyPhotos(); if(document.getElementById("pf-av")) openProfileSheet();
  try{ await db.doc("people/"+uid).update({photo:data}); toast(data?"Guardado: foto de perfil":"Listo, se quitó la foto"); }
  catch(x){ if(prev) photos[me]=prev; else delete photos[me]; applyPhotos(); toast(errMsg(x)); }
}
async function saveProfile(e){

let S=null;
/* ---------- Hoja: abrir, cerrar y arrastrar para cerrar ---------- */
const SHEET_EASE="cubic-bezier(0.32,0.72,0,1)";
let sheetCloseTimer=null;
function reducedMotion(){return matchMedia("(prefers-reduced-motion: reduce)").matches;}
function sheetEls(){return [document.getElementById("scrim"),document.getElementById("sheet"),document.getElementById("scrimBg")];}
function openScrim(){
  const [sc,sh,bg]=sheetEls();
  clearTimeout(sheetCloseTimer);
  if(sc.classList.contains("open")){
    if(sc.dataset.closing){delete sc.dataset.closing;sh.style.transition=`transform 320ms ${SHEET_EASE}, opacity 200ms ease`;bg.style.transition=`opacity 320ms ${SHEET_EASE}`;sh.style.transform="translateY(0)";sh.style.opacity="1";bg.style.opacity="1";}
    return;
  }
  const rm=reducedMotion();
  sc.classList.add("open");
  sh.style.transition="none";bg.style.transition="none";
  sh.style.transform=rm?"none":"translateY(100%)";sh.style.opacity=rm?"0":"1";bg.style.opacity="0";
  sh.getBoundingClientRect();
  const d=rm?180:480;
  sh.style.transition=`transform ${d}ms ${SHEET_EASE}, opacity 180ms ease`;bg.style.transition=`opacity ${d}ms ${SHEET_EASE}`;
  sh.style.transform="translateY(0)";sh.style.opacity="1";bg.style.opacity="1";
}
function closeSheet(opts){
  S=null;
  const [sc,sh,bg]=sheetEls();
  if(!sc.classList.contains("open")||sc.dataset.closing) return;
  sc.dataset.closing="1";
  const rm=reducedMotion(), v=(opts&&opts.velocity)||0;
  const H=sh.offsetHeight||1, cur=sheetY(sh), remain=Math.max(0,H-cur);
  const d=rm?160:(v>0.2?Math.min(360,Math.max(160,remain/v)):300);
  sh.style.transition=rm?`opacity ${d}ms ease`:`transform ${d}ms ${v>0.2?"cubic-bezier(0.2,0.7,0.3,1)":SHEET_EASE}`;
  bg.style.transition=`opacity ${d}ms ease`;
  if(rm) sh.style.opacity="0"; else sh.style.transform="translateY(100%)";
  bg.style.opacity="0";
  sheetCloseTimer=setTimeout(()=>{sc.classList.remove("open");delete sc.dataset.closing;sh.style.transition="none";sh.style.transform="";sh.style.opacity="";},d+20);
}
function sheetY(sh){const m=getComputedStyle(sh).transform;if(!m||m==="none")return 0;try{return new DOMMatrixReadOnly(m).m42;}catch(e){return 0;}}
(function sheetDrag(){
  const sh=document.getElementById("sheet"), bg=document.getElementById("scrimBg");
  let g=null, swallow=false;
  const rubber=x=>-(Math.sqrt(x)*4);
  function start(x,y,target){
    if(document.getElementById("scrim").dataset.closing) return;
    if(target.closest("input,select,textarea,[data-no-drag]")) return;
    g={x0:x,y0:y,active:false,startScroll:sh.scrollTop,H:sh.offsetHeight,samples:[[performance.now(),0]]};
  }
  function move(x,y,ev){
    if(!g) return;
    const dx=x-g.x0, dy=y-g.y0;
    if(!g.active){
      if(Math.abs(dy)<8&&Math.abs(dx)<8) return;
      if(dy>0&&Math.abs(dy)>Math.abs(dx)&&sh.scrollTop<=0&&g.startScroll<=0){g.active=true;g.y0=y;sh.style.transition="none";bg.style.transition="none";}
      else {g=null;return;}
    }
    if(ev.cancelable) ev.preventDefault();
    const d=y-g.y0, ty=d>=0?d:rubber(-d);
    sh.style.transform=`translateY(${ty}px)`;
    bg.style.opacity=String(Math.max(0,1-Math.max(0,ty)/g.H));
    g.samples.push([performance.now(),d]); if(g.samples.length>6) g.samples.shift();
  }
  function end(){
    if(!g) return; const s=g; g=null;
    if(!s.active) return;
    swallow=true; setTimeout(()=>swallow=false,60);
    const a=s.samples[0], b=s.samples[s.samples.length-1];
    const v=(b[1]-a[1])/Math.max(1,b[0]-a[0]); // px/ms, + hacia abajo
    const dist=Math.max(0,b[1]);
    if(dist>s.H*0.35||(v>0.4&&dist>12)){closeSheet({velocity:Math.max(v,0.6)});return;}
    sh.style.transition=`transform 320ms ${SHEET_EASE}`;bg.style.transition=`opacity 320ms ${SHEET_EASE}`;
    sh.style.transform="translateY(0)";bg.style.opacity="1";
  }
  sh.addEventListener("touchstart",e=>{if(e.touches.length!==1){g=null;return;}const t=e.touches[0];start(t.clientX,t.clientY,e.target);},{passive:true});
  sh.addEventListener("touchmove",e=>{if(e.touches.length!==1)return;const t=e.touches[0];move(t.clientX,t.clientY,e);},{passive:false});
  sh.addEventListener("touchend",end); sh.addEventListener("touchcancel",end);
  sh.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;start(e.clientX,e.clientY,e.target);});
  window.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"&&g)move(e.clientX,e.clientY,e);});
  window.addEventListener("pointerup",e=>{if(e.pointerType==="mouse")end();});
  sh.addEventListener("click",e=>{if(swallow){e.stopPropagation();e.preventDefault();}},true);
})();

async function migrateOld(docs){

  const old=docs.filter(d=>{const t=(d.data()||{}).type;return t&&t!=="aporte";});
  if(!old.length) return;
  migrating=true;
  for(const d of old){
    const x=d.data()||{};
    const data={type:x.type==="ingreso"?"ingreso":"gasto",amount:num(x.amount,0),cur:okCur(x.cur),cat:typeof x.cat==="string"?x.cat:"Otros",note:typeof x.note==="string"?x.note:"",date:isDate(x.date)?x.date:todayStr(),created:num(x.created,Date.now())};
    try{ if(data.amount>0) await myPriv().doc(d.id).set(data); await myAportes().doc(d.id).delete(); }catch(e){}
  }
  migrating=false;
}

const ANIM_D=500, animEase=x=>1-Math.pow(1-x,3), animSt=new Map(), animSeen=new Set();
function animCur(s,now){if(!s.start)return s.val;const x=(now-s.start)/ANIM_D;return x>=1?s.val:s.from+(s.val-s.from)*animEase(x);}
let numLoop=0;
function numFrame(){
  numLoop=0; const now=performance.now(); let more=false;
  animSt.forEach((s,k)=>{if(!k.startsWith("n:")||!s.start)return;const done=now-s.start>=ANIM_D;const v=Math.round(done?s.val:animCur(s,now));
    document.querySelectorAll(`[data-num="${CSS.escape(k.slice(2))}"]`).forEach(el=>el.textContent=v.toLocaleString("es-PE"));
    if(done)s.start=0;else more=true;});
  if(more) numLoop=requestAnimationFrame(numFrame);
}
function runAnims(){
  const rm=reducedMotion(), now=performance.now();
  document.querySelectorAll("[data-ak]").forEach(el=>{
    const k=el.dataset.ak, pre=k.slice(0,k.lastIndexOf(":")), w=parseFloat(el.style.width)||0;
    let s=animSt.get(k);
    if(!s){ if(!animSeen.has(pre)||rm){animSt.set(k,{val:w,start:0});animSeen.add(pre);return;} s={val:0,start:0}; }
    animSeen.add(pre);
    const cur=animCur(s,now), live=s.start&&now-s.start<ANIM_D;
    if(rm||!el.offsetParent){animSt.set(k,{val:w,start:0});return;}
    if(s.val===w&&live){ // otro render a mitad de la animación: continuarla en el elemento nuevo
      el.animate([{width:cur+"%"},{width:w+"%"}],{duration:ANIM_D-(now-s.start),easing:"cubic-bezier(0.23, 1, 0.32, 1)"});return;}
    if(Math.abs(cur-w)<0.2){animSt.set(k,{val:w,start:0});return;}
    animSt.set(k,{val:w,from:cur,start:now});
    el.animate([{width:cur+"%"},{width:w+"%"}],{duration:ANIM_D,easing:"cubic-bezier(0.23, 1, 0.32, 1)"});
  });
  let any=false;
  document.querySelectorAll("[data-num]").forEach(el=>{
    const k="n:"+el.dataset.num, v=Number(el.dataset.val); let s=animSt.get(k);
    if(!s||rm||!el.offsetParent){animSt.set(k,{val:v,start:0});return;}
    const cur=animCur(s,now), live=s.start&&now-s.start<ANIM_D;
    if(s.val===v){ if(live){el.textContent=Math.round(cur).toLocaleString("es-PE");any=true;} return; }
    animSt.set(k,{val:v,from:cur,start:now}); el.textContent=Math.round(cur).toLocaleString("es-PE"); any=true;
  });
  if(any&&!numLoop) numLoop=requestAnimationFrame(numFrame);
}

}

  const evb=e.target.closest("[data-act]");
  if(evb){const ev=findAct(evb.dataset.act);if(ev)openActSheet(ev,{occ:evb.dataset.date||""});return;}
  const sc=e.target.closest("[data-sacar]");
  if(sc){openSheet(null,{type:"aporte",viaje:sc.dataset.sacar,adir:"out"});return;}
  const ap=e.target.closest("[data-aportar]");
  if(ap){openSheet(null,{type:"aporte",viaje:ap.dataset.aportar});}
});
document.getElementById("scrim").addEventListener("click",e=>{if(e.target.id==="scrim"||e.target.id==="scrimBg")closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-trip]")){e.preventDefault();openTripSheet(e.target.dataset.trip);}});
document.getElementById("fab").onclick=()=>tab==="calendario"?openActSheet(null,{date:calSel}):openSheet(null,tab==="viajes"?{type:"aporte"}:null);
window.addEventListener("hashchange",()=>showTab(location.hash.slice(1)));
applyTheme(getTheme());
applyPalette(getPalette());
(function(){const s=document.getElementById("splash");if(s){s.innerHTML=appIconSVG(getPalette());setTimeout(hideSplash,2500);}})();
function hideSplash(){const s=document.getElementById("splash");if(!s||s.classList.contains("out"))return;s.classList.add("out");setTimeout(()=>s.remove(),300);}

renderAll();
showTab(location.hash.slice(1)||"inicio");
setInterval(tickClocks,20000);

/* ---------- Conexión ---------- */
window.__cb={CITIES,PERSON_COLORS,hideSplash:()=>hideSplash()};
window.__startCloseby=async function init(){
  if(window.__cbStarted) return; window.__cbStarted=true;
  if(!window.claude||typeof window.claude.use!=="function"){setStatus("Cargando…");return;}
  setStatus("Cargando sus datos…");
  db=await window.claude.use("db");
  const user=await window.claude.use("user");
  if(!db){setStatus("No se pudo conectar con los datos. Revisa tu internet.");return;}
  let owner=false;
  try{uid=user?await user.id():null;}catch(e){uid=null;}
  try{owner=user?!!(await Promise.resolve(user.isOwner())):false;}catch(e){owner=false;}
  me=uid?(owner?"p1":"p2"):null;
  renderAll(); showTab(tab);

  const timer=setTimeout(()=>{if(Object.values(loaded).some(x=>!x))setStatus("Los datos están tardando en llegar. Revisa tu conexión; se actualizarán solos.");},10000);
  const done=()=>{if(loaded.cfg)hideSplash();if(Object.values(loaded).every(Boolean)){clearTimeout(timer);setStatus("");}};
  const fail=msg=>()=>{clearTimeout(timer);setStatus(msg);};

  db.doc("app/config").onSnapshot(snap=>{
    cfgExists=snap.exists; cfg=mergeCfg(snap.exists?snap.data():{});
    if(!snap.metadata.fromCache){loaded.cfg=true;done();} renderAll();
  },fail("No se pudo leer la configuración. Recarga la página más tarde."));

  db.collection("horarios").onSnapshot(snap=>{
    const n={}; snap.docs.forEach(d=>{n[d.id]=d.data()||{};}); horarios=n; renderAll();
  },()=>{});
  if(uid&&me){
    db.doc("data/users/"+uid+"/cal").collection("items").onSnapshot(snap=>{
      myPrivActs=snap.docs.map(d=>cleanAct(d.id,d.data(),uid,me,"private")).filter(Boolean); renderAll();
    },()=>{});
  }
  db.collection("viajes").onSnapshot(snap=>{
    viajes=snap.docs.map(d=>cleanViaje(d.id,d.data())).filter(Boolean);
    if(!snap.metadata.fromCache){loaded.viajes=true;done();} renderAll();
  },fail("No se pudieron leer los viajes. Recarga la página más tarde."));

  if(uid&&me){
    try{ const pref=db.doc("people/"+uid), cur=await pref.get(); const keep=cur&&cur.exists&&cur.data()&&typeof cur.data().photo==="string"?{photo:cur.data().photo}:{};
      await pref.set({...keep,slot:me,online:document.visibilityState!=="hidden",seen:Date.now()}); }catch(e){setStatus(errMsg(e));}
    let lastOn=document.visibilityState!=="hidden";
    const mark=on=>{ if(on===lastOn) return; lastOn=on; db.doc("people/"+uid).update({online:on,seen:Date.now()}).catch(()=>{}); };
    document.addEventListener("visibilitychange",()=>mark(document.visibilityState==="visible"));
    window.addEventListener("pagehide",()=>mark(false));
    myPriv().onSnapshot(snap=>{
      mine=snap.docs.filter(d=>d.id!=="prefs").map(d=>cleanPersonal(d.id,d.data())).filter(Boolean);
      const pd=snap.docs.find(d=>d.id==="prefs"); prefs=pd?(pd.data()||{}):{}; applyPalette(getPalette());
      if(!snap.metadata.fromCache){loaded.priv=true;done();} renderAll();
    },fail("No se pudieron leer tus movimientos. Recarga la página más tarde."));
  }else loaded.priv=true;

  db.collection("people").onSnapshot(snap=>{
    const next={}; presence={}; photos={}; snap.docs.forEach(d=>{const x=d.data()||{},s=x.slot;if(s==="p1"||s==="p2"){next[d.id]=s;if(typeof x.photo==="string"&&/^data:image\/(jpeg|png|webp);base64,/.test(x.photo)&&x.photo.length<120000)photos[s]=x.photo;else delete photos[s];presence[s]={online:x.online===true,seen:Number(x.seen)||0};}});
    people=next; Object.keys(people).forEach(watchPerson); Object.keys(people).forEach(watchActs);
    if(!snap.metadata.fromCache){loaded.people=true;done();}
    rebuildAportes(); renderAll();
  },fail("No se pudieron leer los ahorros. Recarga la página más tarde."));
};
if(window.claude) window.__startCloseby();
})();

</script>
