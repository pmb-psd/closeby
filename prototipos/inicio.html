<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Closeby · Prototipos del Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEE9FF; --card:#FFFFFF; --chip:#E2DBFF; --ink:#141317; --muted:#6B6578; --line:rgba(20,19,23,.08);
  --lime:#D5F542; --on-lime:#141317; --lila:#7B4DFF; --soft:#C9B8FF;
  --p1:#E9622B; --p2:#13928E; --good:#1F8A4C;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box}
html{scrollbar-width:none;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none}
body{margin:0;padding-top:60px;background:#D9D3EA;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased}
.phone{max-width:430px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;padding:0 18px 140px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px}
.logo{display:flex;align-items:center;gap:6px;font-family:Outfit,var(--font);font-weight:600;font-size:22px;letter-spacing:-.02em}
.logo svg{width:26px;height:26px}
.me{width:38px;height:38px;border-radius:50%;background:var(--p1);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 3px #fff}
.card{background:var(--card);border-radius:24px;padding:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.press{transition:transform 140ms ease-out}.press:active{transform:scale(.97)}
.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(394px,calc(100% - 36px));height:64px;border-radius:32px;background:#141317;display:flex;justify-content:space-around;align-items:center;z-index:5;box-shadow:0 10px 30px rgba(20,19,23,.25)}
.dock span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:rgba(255,255,255,.7)}
.dock span.on{background:var(--lime);color:#141317}
.dock svg{width:20px;height:20px}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.av.p1{background:var(--p1)}.av.p2{background:var(--p2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%}
.dot.p1{background:var(--p1)}.dot.p2{background:var(--p2)}
/* entrada escalonada (ocasional: al abrir la app) */
.in{animation:in 420ms var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.in{animation:fade 200ms ease both}@keyframes fade{from{opacity:0}to{opacity:1}}}

/* ===== V2 Cuenta regresiva ===== */
.cr-hero{margin:4px -18px 0;padding:22px 22px 26px;background:var(--lila);color:#fff;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.cr-hero .hi{font-size:15px;opacity:.85}
.cr-big{display:flex;align-items:flex-end;gap:12px;margin:6px 0 2px}
.cr-big b{font-size:118px;line-height:.82;font-weight:800;letter-spacing:-.06em}
.cr-big span{font-size:20px;font-weight:600;line-height:1.1;padding-bottom:8px}
.cr-trip{font-size:14px;opacity:.9}
.cr-dots{display:grid;grid-template-columns:repeat(17,1fr);gap:4px;margin-top:16px}
.cr-dots i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.22)}
.cr-dots i.d{background:var(--lime)}
.cr-dots i.t{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.cr-cap{display:flex;justify-content:space-between;font-size:11px;opacity:.75;margin-top:8px}
.cr-clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cr-clock{border-radius:22px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:2px}
.cr-clock b{font-size:30px;font-weight:700;letter-spacing:-.04em}
.cr-clock small{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.cr-call{margin-top:10px;display:flex;align-items:center;gap:12px;background:var(--lime);border-radius:22px;padding:14px 16px}
.cr-call .ic{width:40px;height:40px;border-radius:50%;background:#141317;color:var(--lime);display:grid;place-items:center;flex:none}
.cr-call b{display:block;font-size:15px}
.cr-call small{font-size:12px;opacity:.75}
.cr-fund{margin-top:10px;display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring circle{fill:none}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:17px}
.cr-fund .tx{min-width:0;flex:1}
.cr-fund .tx b{font-size:24px;font-weight:700;letter-spacing:-.03em;display:block}
.cr-ahorrar{margin-top:10px;width:100%;height:50px;border-radius:999px;background:#141317;color:#fff;font-weight:600;font-size:15px}
.grow{transform-origin:left center;animation:grow 800ms var(--ease) 200ms both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.arc{animation:arc 900ms var(--ease) 250ms both}
@keyframes arc{from{stroke-dasharray:0 100}}
@media (prefers-reduced-motion: reduce){.grow,.arc{animation:none}}

/* ===== V3 Bento ===== */
.bn-hi{font-size:26px;font-weight:300;letter-spacing:-.03em;margin:6px 0 14px;line-height:1.1}
.bn-hi b{font-weight:700}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt{border-radius:24px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative;overflow:hidden}
.bt .k{font-size:12px;color:var(--muted);font-weight:500}
.bt.count{background:#141317;color:#fff;grid-row:span 2;justify-content:space-between}
.bt.count .k{color:rgba(255,255,255,.6)}
.bt.count b{font-size:84px;line-height:.85;font-weight:800;letter-spacing:-.06em;color:var(--lime)}
.bt.count .ln{font-size:13px;opacity:.85;line-height:1.3}
.bt.clock b{font-size:26px;font-weight:700;letter-spacing:-.04em}
.bt.clock .k{display:flex;align-items:center;gap:6px}
.bt.clock .night{position:absolute;right:12px;top:12px;font-size:16px}
.bt.fund{grid-column:span 2;background:var(--lime);flex-direction:row;align-items:center;gap:14px}
.bt.fund .tx{flex:1;min-width:0}
.bt.fund .tx b{font-size:28px;font-weight:700;letter-spacing:-.04em;display:block}
.bt.fund .k{color:rgba(20,19,23,.65)}
.bt.fund .pb{width:44px;height:44px;border-radius:50%;background:#141317;color:var(--lime);display:grid;place-items:center;font-size:24px;flex:none}
.bt.call{background:var(--lila);color:#fff}
.bt.call .k{color:rgba(255,255,255,.75)}
.bt.call b{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.bt.prio .seg{display:flex;gap:3px;height:10px}
.bt.prio .seg i{border-radius:4px;background:var(--chip);display:block;position:relative;overflow:hidden}
.bt.prio .seg i>u{position:absolute;inset:0 auto 0 0;background:var(--lila);border-radius:4px}
.bt.prio b{font-size:17px;font-weight:700}
.bt.wide{grid-column:span 2}
.bt.money b{font-size:22px;font-weight:700;letter-spacing:-.03em}
.feed{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.fi{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fi:first-child{border-top:0}
.fi .t{flex:1;min-width:0}
.fi .t b{display:block;font-size:14px;font-weight:600}
.fi .t small{font-size:12px;color:var(--muted)}
.fi .a{font-weight:700;color:var(--good);font-size:14px}

/* ===== V4 Pasaje ===== */
.ps-hi{font-size:15px;margin:4px 0 12px}
.ps-hi b{font-weight:700}
.ticket{position:relative;border-radius:26px;background:var(--card);overflow:hidden;filter:drop-shadow(0 8px 20px rgba(80,50,180,.12))}
.tk-top{padding:16px 18px 18px;background:var(--lila);color:#fff}
.tk-row{display:flex;justify-content:space-between;align-items:flex-start}
.tk-lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;font-weight:600}
.tk-code{font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tk-city{font-size:12px;opacity:.85}
.tk-mid{display:flex;align-items:center;gap:8px;flex:1;padding:18px 12px 0}
.tk-mid i{flex:1;display:block;height:0;border-top:2px dashed rgba(255,255,255,.45)}
.tk-mid svg{width:22px;height:22px;flex:none}
.tk-tear{position:relative;height:0;border-top:2px dashed var(--chip);margin:0 22px}
.tk-tear::before,.tk-tear::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.tk-tear::before{left:-34px}.tk-tear::after{right:-34px}
.tk-bot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:16px 18px}
.tk-bot div{display:flex;flex-direction:column;gap:3px;min-width:0}
.tk-bot b{font-size:20px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.tk-bot .lime{background:var(--lime);border-radius:14px;padding:6px 8px;margin:-6px -8px}
.tk-lbl.d{color:var(--muted);opacity:1}
.stamp{position:absolute;right:16px;top:58px;width:78px;height:78px;border-radius:50%;border:2px solid rgba(213,245,66,.9);color:var(--lime);display:grid;place-items:center;text-align:center;font-size:9px;font-weight:800;letter-spacing:.08em;line-height:1.2;transform:rotate(-12deg)}
.ps-clocks{display:flex;gap:8px;margin:12px 0}
.ps-clocks .pc{flex:1;background:var(--card);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.ps-clocks b{font-size:18px;font-weight:700;letter-spacing:-.03em;margin-left:auto}
.ps-sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--chip);border-radius:2px}
.tl{position:relative;padding:4px 0 12px}
.tl::before{content:"";position:absolute;left:-19px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--chip)}
.tl.done::before{background:var(--good);box-shadow:none}
.tl.now::before{background:var(--lila);box-shadow:0 0 0 4px rgba(123,77,255,.2)}
.tl .row{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.tl .row b{font-weight:600}
.tl .bar{height:6px;border-radius:999px;background:var(--chip);overflow:hidden;margin-top:6px}
.tl .bar i{display:block;height:100%;background:var(--lila);border-radius:999px}
.tl small{font-size:12px;color:var(--muted)}

/* ===== V1 Actual ===== */
.ac-hi{font-size:22px;margin:6px 0 2px}.ac-hi b{font-weight:700}
.ac-t{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1;margin:8px 0}
.ac-t b{font-weight:800;display:block}
.ac-note{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.ac-pills{display:flex;gap:8px;margin:12px 0 6px}
.ac-pills span{background:var(--chip);border-radius:999px;padding:9px 14px;font-size:14px;display:flex;align-items:center;gap:6px}
.ac-call{display:flex;align-items:center;gap:12px;margin:12px 0}
.ac-call .ic{width:40px;height:40px;border-radius:50%;background:var(--lime);display:grid;place-items:center;flex:none}
.limecard{background:var(--lime);border-radius:28px;padding:18px}
.limecard .fig{font-size:52px;font-weight:300;letter-spacing:-.05em;margin:6px 0}
.limecard .fig small{font-size:22px}
.stripe{height:26px;border-radius:999px;background:#141317;padding:4px;display:flex;gap:3px}
.stripe i{display:block;height:100%;border-radius:999px}
.ac-cta{margin-top:12px;height:44px;padding:0 18px;border-radius:999px;background:#141317;color:#fff;font-weight:600}

/* ===== Picker (verbatim) ===== */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,0.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset,0 8px 24px rgba(0,0,0,0.24),0 2px 6px rgba(0,0,0,0.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,0.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(0.23,1,0.32,1),width 250ms cubic-bezier(0.23,1,0.32,1)}
@media (prefers-reduced-motion: reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,0.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,0.85)}
.proto-picker-item:active{transform:scale(0.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,0.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
.proto-picker-divider{width:1px;height:16px;margin:0 4px;background:rgba(255,255,255,0.12)}
.proto-picker-replay{padding:0 10px;font-size:14px}
.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage"></div>

<nav class="proto-picker" data-position="top" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Actual</button>
  <button class="proto-picker-item">Reencuentro</button>
  <button class="proto-picker-item">Bento</button>
  <button class="proto-picker-item">Pasaje</button>
  <span class="proto-picker-divider" aria-hidden="true"></span>
  <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
</nav>

<script>
const LOGO='<svg viewBox="0 0 32 32"><path d="M22 9.5a9 9 0 1 0 0 13" fill="none" stroke="#141317" stroke-width="5" stroke-linecap="round"/><circle cx="26.5" cy="16" r="3" fill="#7B4DFF"/></svg>';
const I={home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M10 20v-5h4v5"/></svg>',
 wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11l7 2 2 7z"/><path d="m10 13 4-4"/></svg>',
 video:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>',
 moon:'🌙'};
const topbar=()=>`<div class="top"><span class="logo">${LOGO}closeby</span><span class="me">F</span></div>`;
const dock=()=>`<nav class="dock"><span class="on">${I.home}</span><span>${I.wallet}</span><span>${I.cal}</span><span>${I.plane}</span></nav>`;
const d=(ms)=>`style="animation-delay:${ms}ms"`;
function ring(size,sw,w1,w2,center){const r=(size-sw)/2;return `<span class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(20,19,23,.1)" stroke-width="${sw}"/><circle class="arc" cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--p1)" stroke-width="${sw}" pathLength="100" stroke-dasharray="${w1-1} 100" stroke-linecap="round"/><circle class="arc" style="animation-delay:380ms" cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--p2)" stroke-width="${sw}" pathLength="100" stroke-dasharray="${w2-1} 100" stroke-dashoffset="${-w1}" stroke-linecap="round"/></svg><span class="c num">${center}</span></span>`;}

const variants=[
// 1 — Actual
()=>`<div class="phone">${topbar()}
  <div class="ac-hi in">Hola, <b>Flavia</b></div>
  <div class="ac-t in" ${d(40)}>Faltan<b class="num">34 días</b></div>
  <div class="ac-note in" ${d(80)}>para Navidad en Lima · 20 de diciembre · Lima</div>
  <div class="ac-pills in" ${d(110)}><span><i class="dot p1"></i>Lima <b class="num">11:12</b></span><span><i class="dot p2"></i>Montreal <b class="num">11:12</b></span></div>
  <div class="card ac-call in" ${d(140)}><span class="ic">${I.video}</span><span><b>Hoy pueden hablar</b><br><small class="muted">De 17:00 a 24:00 (tu hora)</small></span></div>
  <div class="limecard in" ${d(170)}><div class="small" style="font-weight:500">▍Fondo · Navidad en Lima</div>
    <div class="fig num"><small>S/ </small><b style="font-weight:400">1,238</b><small style="opacity:.55">/3,000</small></div>
    <div class="stripe"><i class="grow" style="width:24%;background:var(--p1)"></i><i class="grow" style="width:17%;background:var(--p2)"></i></div>
    <div class="small" style="display:flex;justify-content:space-between;margin-top:8px"><span>Flavia S/ 720 · Ariana S/ 518</span><b>41%</b></div>
    <div class="small" style="margin-top:6px">✓ <b>Vuelos</b> · Ahora llenando: <b>Hotel</b> · faltan S/ 662</div>
    <button class="ac-cta press">+ Ahorrar para este viaje</button></div>
  ${dock()}</div>`,

// 2 — Cuenta regresiva: la emoción del reencuentro manda
()=>{const past=26, total=60; let dots=""; for(let i=0;i<total/60*51;i++){dots+=`<i class="${i<past?"d":i===past?"t":""}"></i>`;}
 return `<div class="phone">${topbar()}
  <section class="cr-hero in">
    <div class="hi">Hola, Flavia</div>
    <div class="cr-big"><b class="num">34</b><span>días para<br>abrazarse</span></div>
    <div class="cr-trip">Navidad en Lima · sáb 20 de diciembre</div>
    <div class="cr-dots" aria-label="26 días desde que reservaron, 34 por delante">${dots}</div>
    <div class="cr-cap"><span>Desde que lo planearon</span><span>20 dic ♥</span></div>
  </section>
  <div class="cr-clocks">
    <div class="cr-clock in" ${d(80)}><small><i class="dot p1"></i>Flavia · Lima</small><b class="num">11:12</b><small>Lunes</small></div>
    <div class="cr-clock in" ${d(120)}><small><i class="dot p2"></i>Ariana · Montreal</small><b class="num">11:12</b><small>Misma hora</small></div>
  </div>
  <div class="cr-call in" ${d(160)}><span class="ic">${I.video}</span><span style="flex:1"><b>Hoy pueden hablar</b><small>De 17:00 a 24:00</small></span><span style="font-size:20px">›</span></div>
  <div class="card cr-fund in" ${d(200)}>${ring(84,11,24,17,"41%")}<div class="tx"><span class="small muted">Fondo del viaje</span><b class="num">S/ 1,238</b><span class="small muted">de S/ 3,000 · Hotel en curso</span></div></div>
  <button class="cr-ahorrar press in" ${d(240)}>+ Ahorrar para el viaje</button>
  ${dock()}</div>`;},

// 3 — Bento: todo de un vistazo, sin scroll
()=>`<div class="phone">${topbar()}
  <div class="bn-hi in">Hola, <b>Flavia</b></div>
  <div class="bento">
    <div class="bt count in" ${d(30)}><span class="k">Navidad en Lima</span><b class="num">34</b><span class="ln">días para<br>verse · 20 dic</span></div>
    <div class="bt clock in" ${d(70)}><span class="k"><i class="dot p1"></i>Lima</span><b class="num">11:12</b></div>
    <div class="bt clock in" ${d(100)}><span class="k"><i class="dot p2"></i>Montreal</span><b class="num">11:12</b></div>
    <div class="bt fund press in" ${d(130)}>${ring(70,9,24,17,"41%")}<div class="tx"><span class="k">Fondo del viaje</span><b class="num">S/ 1,238</b><span class="small" style="opacity:.7">de S/ 3,000</span></div><span class="pb">+</span></div>

/* --- picker wiring (verbatim) --- */
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
